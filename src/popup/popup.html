<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-shell">
    <!-- ===== Header ===== -->
    <header class="hdr">
      <div class="hdr-mark" aria-hidden="true">📖</div>
      <div class="hdr-text">
        <h1 class="hdr-title">WEB閲覧アシスト</h1>
        <p class="hdr-tag">増幅 / 整理 / 維持 を 1 つのパネルから</p>
      </div>
    </header>

    <!-- ===== Audio Group ===== -->
    <section class="grp" aria-label="オーディオ">
      <h2 class="grp-title">
        <span class="grp-title-text">オーディオ</span>
      </h2>

      <!-- 音量ブースターはマスタートグルなしの常時表示。100% でリソース解放、それ以外で増幅。 -->
      <div class="sub-block volume-track-mark" id="volumeRow">
        <div class="sub-head">
          <span class="sub-label">
            <span aria-hidden="true">🔊</span>&nbsp;音量ブースター
          </span>
          <span class="sub-value" id="volumeValue">100%</span>
        </div>
        <input type="range" id="volumeSlider" class="range" />
        <div class="volume-actions">
          <button type="button" id="volumeResetBtn" class="ghost-btn" aria-label="音量を 100% に戻す">100% に戻す</button>
          <span class="volume-hint" id="volumeHint"></span>
        </div>

        <!-- 自動歪み防止 / 自動音量正規化（オプトイン・デフォルト OFF） -->
        <label class="toggle-row toggle-row--sub" id="volumeAntiClipToggleRow">
          <span class="tr-icon" aria-hidden="true">🛡️</span>
          <span class="tr-text">
            <span class="tr-name">自動歪み防止</span>
            <span class="tr-desc">高い増幅率でもピークを抑え音割れを防止（DynamicsCompressor 即応リミッタ）</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="volumeAntiClipToggle" />
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>

        <label class="toggle-row toggle-row--sub" id="volumeNormalizeToggleRow">
          <span class="tr-icon" aria-hidden="true">📊</span>
          <span class="tr-text">
            <span class="tr-name">自動音量正規化</span>
            <span class="tr-desc">動画ごとの音量バラつきを緩く圧縮して均一化（DynamicsCompressor ナチュラル圧縮）</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="volumeNormalizeToggle" />
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </div>
    </section>

    <!-- ===== YouTube Group ===== -->
    <section class="grp" aria-label="YouTube">
      <h2 class="grp-title">
        <span class="grp-title-text">YouTube</span>
        <span class="grp-pill" id="searchFixerPill"></span>
      </h2>

      <label class="toggle-row" id="searchFixerToggleRow">
        <span class="tr-icon" aria-hidden="true">🧹</span>
        <span class="tr-text">
          <span class="tr-name">YouTube クリーナー</span>
          <span class="tr-desc">Shorts 削除・検索結果ノイズ除去・動画ページ整形など 20 サブ機能を一括管理</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="searchFixerToggle" />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <!-- YouTube クリーナー詳細 -->
      <details class="accordion" id="cleanerAccordion">
        <summary class="acc-summary">
          <span class="acc-icon" aria-hidden="true">⚙️</span>
          <span class="acc-label">クリーナー詳細設定</span>
          <span class="acc-count" id="cleanerCount"></span>
          <span class="acc-chevron" aria-hidden="true"></span>
        </summary>

        <div class="acc-body">
          <p class="acc-hint">
            マスタートグル（クリーナー）が ON のときだけ動作します。
            個別に ON / OFF を選んでカスタマイズしてください。
          </p>

          <!-- カテゴリブロックは popup.js が生成する -->
          <div id="featureCategories"></div>

          <!-- グリッド列数（select）。クリーナー OFF でも storage に保存されるが見た目は dim -->
          <div class="select-row">
            <label class="select-label" for="gridItemsSelect">
              <span class="select-icon" aria-hidden="true">🔢</span>
              <span class="select-name">ホーム列数</span>
            </label>
            <select id="gridItemsSelect" class="select"></select>
          </div>
        </div>
      </details>
    </section>

    <!-- ===== Amazon Group ===== -->
    <section class="grp" aria-label="Amazon">
      <h2 class="grp-title">
        <span class="grp-title-text">Amazon</span>
      </h2>

      <label class="toggle-row" id="amazonDeliveryToggleRow">
        <span class="tr-icon" aria-hidden="true">📦</span>
        <span class="tr-text">
          <span class="tr-name">定期おトク便 月別合計</span>
          <span class="tr-desc">配送月ごとの合計金額を <code class="tr-code">/auto-deliveries</code> ページに表示</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="amazonDeliveryToggle" />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <!-- ===== Instagram Group ===== -->
    <section class="grp" aria-label="Instagram">
      <h2 class="grp-title">
        <span class="grp-title-text">Instagram</span>
        <span class="grp-pill" id="instagramCleanerPill"></span>
      </h2>

      <label class="toggle-row" id="instagramCleanerToggleRow">
        <span class="tr-icon" aria-hidden="true">📷</span>
        <span class="tr-text">
          <span class="tr-name">Instagram クリーナー</span>
          <span class="tr-desc">Reels / Explore / Stories などの冗長 UI を一括非表示</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="instagramCleanerToggle" />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <!-- Instagram クリーナー詳細 -->
      <details class="accordion" id="igCleanerAccordion">
        <summary class="acc-summary">
          <span class="acc-icon" aria-hidden="true">⚙️</span>
          <span class="acc-label">クリーナー詳細設定</span>
          <span class="acc-count" id="igCleanerCount"></span>
          <span class="acc-chevron" aria-hidden="true"></span>
        </summary>

        <div class="acc-body">
          <p class="acc-hint">
            マスタートグル（クリーナー）が ON のときだけ動作します。
            個別に ON / OFF を選んでカスタマイズしてください。
          </p>

          <!-- カテゴリブロックは popup.js が生成する -->
          <div id="igFeatureCategories"></div>
        </div>
      </details>
    </section>

    <!-- ===== Session ===== -->
    <section class="grp" aria-label="セッション">
      <h2 class="grp-title"><span class="grp-title-text">セッション</span></h2>

      <label class="toggle-row" id="keepAliveToggleRow">
        <span class="tr-icon" aria-hidden="true">🔄</span>
        <span class="tr-text">
          <span class="tr-name">セッション維持</span>
          <span class="tr-desc">合成イベント dispatch でアイドル検知をリセット</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="keepAliveToggle" />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <!-- セッション維持 ON 時のみ表示するサブ設定群 -->
      <div class="sub-block hidden" id="intervalRow">
        <div class="sub-head">
          <span class="sub-label">ポーリング間隔</span>
          <span class="sub-value" id="intervalValue"></span>
        </div>
        <input type="range" id="intervalSlider" class="range" step="1" />

        <!-- HTTP ping サブトグル（オプトイン・デフォルト OFF） -->
        <label class="toggle-row toggle-row--sub" id="keepAliveHttpPingToggleRow">
          <span class="tr-icon" aria-hidden="true">🌐</span>
          <span class="tr-text">
            <span class="tr-name">サーバーへの軽量 ping を併発</span>
            <span class="tr-desc">同一オリジンに HEAD/GET。認証プロキシ環境では OFF 推奨</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="keepAliveHttpPingToggle" />
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </div>
    </section>

    <!-- ===== Status (live region) ===== -->
    <p class="footer-status" id="statusMsg" role="status" aria-live="polite"></p>
  </div>

  <script src="../lib/actions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
