name: Publish to Chrome Web Store

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store 公開
    runs-on: ubuntu-latest
    steps:
      # サプライチェーン攻撃対策で SHA ピン留め (#6)。タグは指すコミットを書き換え可能なため
      # 信頼境界として弱い。Dependabot (.github/dependabot.yml) が SHA + タグコメント形式の
      # 更新 PR を自動生成するので、そちらをマージして最新化する運用。
      - name: リポジトリをチェックアウト
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Node セットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '20'

      - name: 依存インストール
        # lockfile の整合性を強制するため npm ci のみ。`|| npm install` フォールバックは
        # lockfile を迂回して最新依存を取得するため、サプライチェーン攻撃の経路になりうる。
        # lockfile が古い場合は CI を失敗させ、開発者に更新を促す。
        run: npm ci

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: zip パッケージを作成
        run: |
          zip -r web-viewing-assist.zip manifest.json icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh web-viewing-assist.zip

      - name: Chrome Web Store に Draft アップロード
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set +e
          # chrome-webstore-upload-cli は devDependencies 経由で固定バージョン + lockfile integrity
          # 付きでインストール済み（package.json 参照）。npx はローカル node_modules/.bin を使うため
          # レジストリから再ダウンロードしない（= 実行時改ざんの経路を閉じる）。
          #
          # **意図的に --auto-publish を使わない**: 即審査キューに入れると Chrome Web Store の listing
          # （説明文 / スクリーンショット / カテゴリ）が編集ロックされ、ストア掲載文を更新したい場合に
          # 一度キャンセル → 再提出が必要になる。Draft only にしておけば Dashboard で listing を整えてから
          # 手動で「公開」ボタンを押す運用ができ、ZIP と説明文を整合させたまま審査に出せる。
          # CWS API には listing 更新エンドポイントが存在しない (v2 API の discovery document で確認済み)
          # ため、Dashboard 経由のレビューが必須な以上、auto-publish は罠にしかならない。
          output=$(npx chrome-webstore-upload-cli upload \
            --source web-viewing-assist.zip \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN" 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            echo "🎉 Chrome Web Store に Draft としてアップロード完了！"
            echo "📝 次のステップ: Developer Dashboard で listing（説明文 / スクリーンショット / 権限の正当性）を確認・更新してから「公開」ボタンを押してね"
            echo "🔗 https://chrome.google.com/webstore/devconsole"
            exit 0
          fi
          exit $exit_code
