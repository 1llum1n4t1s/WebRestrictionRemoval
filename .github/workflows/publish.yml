name: Publish to Chrome Web Store + Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  package:
    name: ZIP パッケージ作成
    runs-on: ubuntu-latest
    outputs:
      # version を後続 job (publish / publish-firefox) の pre-flight check に渡す。
      # 同 version が既に存在する場合、CWS は upload のみ、AMO は submission 全体を skip して
      # 「同 version 重複 push 拒否」エラーを未然に防ぐ (/rere F-002 修正)。
      version: ${{ steps.version.outputs.version }}
    steps:
      # サプライチェーン攻撃対策で SHA ピン留め (#6)。タグは指すコミットを書き換え可能なため
      # 信頼境界として弱い。Dependabot (.github/dependabot.yml) が SHA + タグコメント形式の
      # 更新 PR を自動生成するので、そちらをマージして最新化する運用。
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
        # /rere レビュー A3-004: persist-credentials を明示的に無効化。本 workflow では
        # GITHUB_TOKEN を使った git push を行わないので、.git/config に書き残さない方が
        # 防御深層として安全 (script injection 経由の token 漏洩経路を完全に閉じる)
        with:
          persist-credentials: false

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          # メジャーバージョンのみ指定 (例: 11) だと action-setup が起動時に最新パッチへの
          # 自動切替を試み、その自己更新処理内で pnpm 側のバグを踏んで
          # "Cannot use 'in' operator to search for 'integrity' in undefined" でクラッシュする
          # 事例を観測 (2026-07-13)。厳密バージョン固定で自動切替そのものを回避する。
          version: 11.7.0

      - name: Node セットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 依存インストール
        # lockfile の整合性を強制するため pnpm install --frozen-lockfile のみ。
        # frozen-lockfile は lockfile を迂回した最新依存取得を禁止し、サプライチェーン攻撃の
        # 経路を塞ぐ。lockfile が古い場合は CI を失敗させ、開発者に更新を促す。
        env:
          # publish workflow ではスクリーンショット生成をしないため、Puppeteer のブラウザ取得は不要。
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: テスト実行
        run: pnpm test

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: zip パッケージを作成
        run: |
          # _locales/ は manifest.json の default_locale 参照先 (en/ja の messages.json)。
          # 含めないと CWS の Submit for review で `PKG_DEFAULT_LOCALE_MISSING` エラー。
          # 2026-05-13: Draft only 時代はフル validation が走らず通過していたが、auto-publish
          # 化で発覚した bug。zip.ps1 / zip.sh は最初から _locales を含めている。
          zip -r web-viewing-assist.zip manifest.json icons src _locales \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh web-viewing-assist.zip

      - name: ZIP artifact を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-viewing-assist-zip
          path: web-viewing-assist.zip
          if-no-files-found: error

      - name: Firefox 用ソースディレクトリを構築
        # manifest.firefox.json を manifest.json として配置し、icons / src / _locales を同梱。
        # 音量ブースター関連 permission (offscreen / tabCapture) は manifest.firefox.json で
        # 除外済み。さらに background.js から chrome.offscreen / chrome.tabCapture の呼び出し
        # ブロックを __FIREFOX_STRIP_BEGIN__ / __FIREFOX_STRIP_END__ マーカー間で物理削除する
        # (AMO linter の UNSUPPORTED_API 警告 3 件を消すため、v1.0.33 で導入)。
        # web-ext sign は zip ではなく source-dir を受け取って自身で xpi を構築するため、
        # ここでは source dir のまま保存する (二度手間の zip 化を避ける)。
        run: |
          mkdir -p firefox-build
          cp manifest.firefox.json firefox-build/manifest.json
          cp -r icons firefox-build/
          cp -r src firefox-build/
          cp -r _locales firefox-build/
          find firefox-build \( -name "*.DS_Store" -o -name "*.swp" -o -name "*~" \) -delete
          # Firefox 未対応 API 呼び出しブロックを strip (AMO linter UNSUPPORTED_API 警告対策)
          perl -i -0pe 's{\s*//\s*__FIREFOX_STRIP_BEGIN__.*?//\s*__FIREFOX_STRIP_END__\s*\n}{\n}gs' firefox-build/src/background/background.js
          echo "🦊 Firefox strip 完了 (chrome.offscreen / chrome.tabCapture 呼び出しを削除)"
          echo "📂 firefox-build 内容:"
          ls -la firefox-build/

      - name: Firefox source artifact を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-viewing-assist-firefox-source
          path: firefox-build/
          if-no-files-found: error

  publish:
    name: Chrome Web Store にアップロード + Submit for review
    runs-on: ubuntu-latest
    needs: package
    environment: chrome-web-store
    steps:
      - name: ZIP artifact を取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-viewing-assist-zip
          path: .

      - name: バージョン pre-flight check (CWS / 既存 version と一致なら upload のみ skip)
        # /rere F-002 修正 + セルフレビュー 2 巡目修正: 同 version 再 upload は CWS API が
        # INVALID_ARGUMENT 等で拒否するため、Items.get API で **draft の crxVersion** を取得して
        # manifest version と一致したら upload だけを skip する。Publish API は別判定とし、
        # 前回 run が upload 成功後に失敗した場合も Submit for review を必ず再試行する。
        #
        # 旧実装は公開 store HTML を grep していたが、CWS の SSR HTML は JSON が二重エスケープされた
        # `"version\":\"X.Y.Z\""` 形式で埋め込まれ、しかも別の埋め込み JSON (API/ranking 等) も
        # version キーを持っているため、HTML scraping では**他拡張機能の version を誤検出**して
        # 常時 skip 化 (silent failure) するリスクがあった (実機検証で 2 件の無関係 version を確認)。
        #
        # ⚠️ `crxVersion` は CWS Items API の公式ドキュメントには記載がない **未文書フィールド**だが、
        # 実機検証 (`?projection=DRAFT`) で `{kind,id,publicKey,uploadState,crxVersion}` が返ることを
        # 確認済み (PlasmoHQ 等の publish ツールでも事実上の標準として使われている)。将来 API 変更で
        # 消えたら draft_version が空になり skip=false 側 (publish 実行) に倒れるので安全。
        #
        # ⚠️ uploadState の判定: 実機検証で publish 済み clean draft は `uploadState: "NOT_FOUND"`
        # (= 保留中アップロード操作なし) を返すことを確認。旧実装の `= "SUCCESS"` 限定だと、まさに
        # 「既に同 version が CWS に存在する」ケースで upload skip に到達せず pre-flight が機能しなかった。
        # uploadState は SUCCESS / NOT_FOUND / IN_PROGRESS / FAILURE を取り、FAILURE のときのみ
        # 「直近アップロード失敗 → 再 upload したい」ので skip しない。それ以外は crxVersion 一致で
        # upload を skip する。Items.get だけでは review 申請済みか確定できないため publish は常に実行する。
        #
        # OAuth refresh は publish step と独立に実行 (token は use-and-forget)、secrets 露出経路は
        # publish step と同等。
        id: cws-preflight
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          MANIFEST_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          # OAuth refresh (publish step と同じ流れ、token はマスク登録)
          token_response=$(curl -fsS \
            -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "client_id=${CWS_CLIENT_ID}" \
            --data-urlencode "client_secret=${CWS_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${CWS_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")
          # python が非 JSON で exit 1 しても inherit_errexit で step ごと落ちないよう `|| echo ""`
          # でフォールバックさせ、直後の空チェック分岐で warning 降格させる (セルフレビュー 2 巡目 #3)。
          access_token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' 2>/dev/null <<< "$token_response" || echo "")
          if [ -z "${access_token:-}" ]; then
            echo "::warning::CWS pre-flight: OAuth token 取得失敗 → upload を実行する安全側へ倒す"
            echo "skip_upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::${token_response}"
          echo "::add-mask::${access_token}"
          # Items.get で draft の crxVersion + uploadState を取得
          draft_response=$(curl -fsS \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}?projection=DRAFT") || draft_response=""
          if [ -z "$draft_response" ]; then
            echo "::warning::CWS pre-flight: Items.get 失敗 → upload を実行する安全側へ倒す"
            echo "skip_upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          draft_version=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("crxVersion",""))' 2>/dev/null <<< "$draft_response" || echo "")
          draft_state=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("uploadState",""))' 2>/dev/null <<< "$draft_response" || echo "")
          echo "📊 CWS draft: version=${draft_version:-(unknown)} state=${draft_state:-(unknown)} / manifest: ${MANIFEST_VERSION}"
          if [ -n "$draft_version" ] && [ "$draft_version" = "$MANIFEST_VERSION" ] && [ "$draft_state" != "FAILURE" ]; then
            echo "::notice::CWS は既に v${MANIFEST_VERSION} を保持 (crxVersion 一致, uploadState=${draft_state})。upload のみ skip (同 version 重複 upload 防止)、Submit for review は再試行"
            echo "skip_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Chrome Web Store にアップロード + Publish API で Submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SKIP_UPLOAD: ${{ steps.cws-preflight.outputs.skip_upload }}
        run: |
          # フルオート申請フロー (2026-05-13 から auto-publish 化、ゆろさん指示):
          # 1) ZIP を Draft としてアップロード
          # 2) Publish API (publishTarget=default) で Submit for review まで自動化
          # release/x.y.z push で push → CI → Submit for review まで一気通貫。
          #
          # **listing 変更時の運用注意**: 説明文 / スクリーンショット / カテゴリ / 権限の正当性などの
          # listing 項目は CWS API に更新エンドポイントが存在しない (v2 API discovery で確認済み)。
          # listing を変更したいリリースでは、push 前 or push 後すぐに Dashboard で listing を整え、
          # **その後 release ブランチを push** することで listing 更新を反映させる運用にする
          # (Submit for review は Draft の最新コミット + 最新 listing で行われるため、listing 変更が
          # 先行していれば追従する)。
          #
          # upload job は pnpm install / pnpm exec / checkout を行わず、Secrets を第三者 npm lifecycle の後段に置かない。
          # package job が作った ZIP artifact だけを fresh runner で受け取り、CWS API へ直接アップロードする。
          #
          # **stdout/stderr は直接ストリームする**: `output=$(... 2>&1)` で一旦変数に取り込んで echo すると、
          # GitHub Actions の自動マスキングは「シークレット文字列がそのまま出力された場合」のみ働くため、
          # CLI が OAuth Bearer Token をエラーメッセージに混ぜてくると平文でログ残存しうる。
          # 直接ストリームすれば Actions ランナー側のマスキングが各シークレットを `***` に置換できる。
          # 注意: `set -e` だけだと `var=$(cmd)` 形式での内部コマンド失敗が errexit されない bash 仕様
          # があるため、access_token が空文字化した状態で curl が "Authorization: Bearer " を送って
          # 401 で失敗 → 「upload エラー」として現れる紛らわしい状況になる。`inherit_errexit` を
          # `set -euo pipefail` の直後 (= 後続の全 command substitution の前) に有効化して、token 取得
          # curl も保護対象に含める (セルフレビュー 2 巡目 #4: shopt 配置を curl より前に移動)。
          set -euo pipefail
          shopt -s inherit_errexit
          # ⚠️ このブロックでは `set -x` を絶対に有効化しない。set -x がトークン取得行を
          # 展開すると CWS_REFRESH_TOKEN / token_response / access_token のいずれかが
          # add-mask 登録前に平文ログに出る可能性がある (/rere レビュー A2-S-1 防御)。
          token_response=$(curl -fsS \
            -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "client_id=${CWS_CLIENT_ID}" \
            --data-urlencode "client_secret=${CWS_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${CWS_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")
          # Python 例外メッセージは標準で token 本体を含まないが、防御深層として stderr を抑制し、
          # KeyError / JSONDecodeError 時のスタックトレースから付帯情報の漏洩可能性をゼロ化する。
          # `|| echo ""` で python 非ゼロ終了を空文字に変換し、inherit_errexit で step が落ちる前に
          # 直後の空チェック分岐 (hard fail) に到達させる (セルフレビュー 2 巡目 #3)。
          access_token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' 2>/dev/null <<< "$token_response" || echo "")
          if [ -z "${access_token:-}" ]; then
            echo "::error::access_token のパースに失敗しました (OAuth refresh response が想定形式でない可能性)"
            exit 1
          fi
          # 動的取得した access_token は GitHub Actions の自動マスキング対象外のため、
          # add-mask で明示的にマスク登録して以降のログ出力でも漏洩しないようにする。
          # token_response は access_token を含む JSON 全体。`set -x` や将来の
          # デバッグ追加で `echo "$token_response"` が混入した場合に Bearer Token
          # が平文ログに残るのを防ぐため、access_token と並列でマスク登録する。
          echo "::add-mask::${token_response}"
          echo "::add-mask::${access_token}"

          # ----- ステップ 1: ZIP を Draft としてアップロード -----
          # 同 version が既に CWS にあれば再 upload せず、前回失敗した Publish API だけを再試行する。
          if [ "${CWS_SKIP_UPLOAD:-false}" = "true" ]; then
            echo "⏭️ Step 1/2: 同 version は upload 済みのため ZIP upload を skip"
          else
            echo "📤 Step 1/2: Chrome Web Store に ZIP をアップロード中..."
            upload_response=$(curl -fsS \
              -X PUT \
              -H "Authorization: Bearer ${access_token}" \
              -H "x-goog-api-version: 2" \
              -H "Content-Type: application/zip" \
              --data-binary @web-viewing-assist.zip \
              "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}")
            echo "✅ アップロード完了"
            # uploadState を確認 (SUCCESS / IN_PROGRESS / FAILURE)。FAILURE なら publish step に進まない。
            upload_state=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("uploadState","UNKNOWN"))' 2>/dev/null <<< "$upload_response")
            echo "📊 uploadState: ${upload_state}"
            if [ "$upload_state" != "SUCCESS" ]; then
              echo "::error::アップロードが SUCCESS ではないため publish を中止します (state=${upload_state})"
              echo "Response: $upload_response"
              exit 1
            fi
          fi

          # ----- ステップ 2: Publish API で Submit for review -----
          # publishTarget=default で全ユーザー公開 (trustedTesters 限定公開も可能だが本番採用)。
          # response の status 配列で OK / ITEM_PENDING_REVIEW / 各種エラーを判定。
          echo "📨 Step 2/2: Publish API で Submit for review..."
          publish_response=$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}/publish?publishTarget=default")
          publish_status=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(d.get("status",[])))' 2>/dev/null <<< "$publish_response")
          echo "📊 Publish status: ${publish_status}"
          case "$publish_status" in
            *OK*|*ITEM_PENDING_REVIEW*)
              echo "🎉 Submit for review 完了！Chrome Web Store のレビューキューに入りました"
              echo "🔗 Dashboard: https://chrome.google.com/webstore/devconsole"
              echo "⏰ レビュー結果は通常 1〜数日でメール通知"
              ;;
            *)
              echo "::error::予期しない publish status: ${publish_status}"
              echo "Response: $publish_response"
              exit 1
              ;;
          esac

  publish-firefox:
    name: Firefox AMO に submission
    runs-on: ubuntu-latest
    needs: package
    # Chrome publish が失敗 (同 version 重複 upload 等) しても Firefox AMO は独立 submit する。
    # ReplaceFontSelect の知見: `if: success() || failure()` がないと「Chrome 失敗 → Firefox AMO
    # 連鎖 skip」でリカバリーフロー全体が機能しなくなる (cancelled() 時のみ skip)。
    if: ${{ success() || failure() }}
    # AMO 用 environment が必要なら gh api で別途作成可能だが、当面は repository scope の
    # AMO_JWT_ISSUER / AMO_JWT_SECRET secrets で動かす (Chrome 側と同じ秘匿レベル)。
    steps:
      - name: リポジトリをチェックアウト
        # web-ext は devDependencies なので package.json + lockfile が必要 (pnpm install で取得)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
        # /rere F-OPS-1 修正: package job と防御深層の整合性確保。本 job では git push を
        # 行わないが、persist-credentials: false で GITHUB_TOKEN を .git/config の extraheader に
        # 残さない (script injection 経由の token 漏洩経路を完全に閉じる)
        with:
          persist-credentials: false

      - name: Firefox source artifact を取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-viewing-assist-firefox-source
          path: firefox-build/

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          # 厳密バージョン固定の理由は同ファイル先頭の pnpm セットアップ step コメント参照。
          version: 11.7.0

      - name: Node セットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: web-ext 依存インストール
        # web-ext は package.json に exact pin、pnpm install --frozen-lockfile で integrity 検証。
        # publish では screenshot 生成不要なので Puppeteer browser DL は skip。
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: バージョン pre-flight check (AMO / 既 submission 済み version なら skip)
        # /rere F-002 修正 + セルフレビュー #2/#4 修正:
        # 同 version 重複 submission は AMO が "Version already exists" で拒否するため、
        # AMO API v5 versions list (anonymous GET 可) で manifest version の存在を確認して skip。
        # 注意: `/versions/` は public listed (= 承認済み) のみ返し、pending / awaiting_review な
        # submission は検知できない。pre-flight pass → web-ext sign 失敗のケースは、submit step
        # 側で "version already exists" を warning 化する fallback 経路で救済する。
        #
        # AMO_SLUG はワークフロー側ハードコードを避け、`vava.config.json` から jq で抽出して SSOT 化
        # (セルフレビュー #4 修正)。これで slug 変更時の更新漏れを防ぐ。
        id: amo-preflight
        env:
          MANIFEST_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          # CodeRabbit 4 巡目: curl 側 (line 371 `|| versions_response=""`) と対称に、jq が
          # vava.config.json 不在 / パース失敗で非ゼロ終了しても inherit_errexit で step ごと
          # hard fail させず、空文字 → 直後の警告 + skip=false 分岐に倒す (publish step が
          # web-ext の gecko id ベース slug 検出で救済できる)。vava.config.json はコミット済みなので
          # 通常は存在するが、fork / 部分 checkout 等での graceful degradation を確保する。
          AMO_SLUG=$(jq -r '.amo.slug // empty' vava.config.json 2>/dev/null || echo "")
          if [ -z "${AMO_SLUG:-}" ]; then
            echo "::warning::vava.config.json の amo.slug が取得できないため AMO pre-flight を skip (publish step に委ねる)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # セルフレビュー 3 巡目修正: CWS pre-flight と対称に `|| fallback` を付ける。
          # 初回 AMO 登録 (add-on 未作成 → HTTP 404) や AMO 一時障害 (5xx / 429 / DNS) で
          # curl -fsS が非ゼロ終了したとき、inherit_errexit 下で step ごと hard fail すると
          # publish-firefox job が前 step fail で連鎖 skip され、submit step の version conflict
          # 救済 fallback (timeout exceeded と同経路) にすら到達しなくなる。空文字に倒して
          # warning + skip=false で publish step (= web-ext sign) に判定を委ねる。
          versions_response=$(curl -fsS \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://addons.mozilla.org/api/v5/addons/addon/${AMO_SLUG}/versions/") || versions_response=""
          if [ -z "$versions_response" ]; then
            echo "::warning::AMO pre-flight: versions list 取得失敗 (初回登録 / 一時障害) → publish step に判定を委ねる"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # MANIFEST_VERSION は環境変数経由で渡す (heredoc を使うと stdin 二重 redirect になり、
          # JSON response との衝突で構文エラーになるため)。python が非 JSON で exit 1 しても
          # inherit_errexit で step ごと落ちないよう `|| echo ""` でフォールバック (CWS 側と対称)。
          exists=$(MANIFEST_VERSION="$MANIFEST_VERSION" python3 -c 'import json,sys,os; target=os.environ["MANIFEST_VERSION"]; data=json.load(sys.stdin); print("1" if any(v.get("version")==target for v in data.get("results",[])) else "0")' 2>/dev/null <<< "$versions_response" || echo "")
          echo "📊 AMO versions check: target=${MANIFEST_VERSION} / exists=${exists:-(parse失敗)}"
          if [ "$exists" = "1" ]; then
            echo "::notice::AMO に既に v${MANIFEST_VERSION} の submission が存在するため AMO publish step を skip (同 version 重複 submission 防止)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Firefox AMO に submit (web-ext sign --channel=listed)
        if: ${{ steps.amo-preflight.outputs.skip != 'true' }}
        # web-ext 10+ では submission API がデフォルト動作 (`--use-submission-api` フラグは廃止)。
        # `--channel=listed` で AMO 公開 (人間レビュー入り)、submission 受付完了で job 成功扱い。
        # 実際のストア反映はレビュー通過後 (通常 1〜数日)、メール通知あり。
        env:
          # AMO API キー (JWT issuer / secret) — 全 variant 共通の Mozilla アカウント credentials。
          # GitHub Secrets に設定: `gh secret set AMO_JWT_ISSUER` / `gh secret set AMO_JWT_SECRET`
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET の GitHub Secrets が未設定です"
            echo "  JWT 発行: https://addons.mozilla.org/ja/developers/addon/api/key/"
            echo "  登録: gh secret set AMO_JWT_ISSUER / gh secret set AMO_JWT_SECRET"
            exit 1
          fi
          # pnpm exec で frozen-lockfile install 済みのローカル版を呼ぶ (CWS 側と同じ
          # サプライチェーン方針)。--source-dir は package job で構築した firefox-build/。
          # --amo-metadata=.amo-metadata.json で version.license: "MIT" を毎回 submission に含める
          # (AMO API v5 仕様: 各 version 提出時に license 明示必須、過去 version からの継承なし)。
          # .amo-metadata.json は categories + version.license のみで listing メタは含まないため、
          # listing の plain text 化リスクなし (AGENTS.md「Firefox AMO 対応」参照)。
          #
          # /vava v1.0.31 + AGENTS.md「Firefox AMO 対応」: `web-ext sign --channel=listed` は
          # AMO の auto-sign を待たずに 15 分で timeout exceeded を返して exit 1 になる既知挙動。
          # submission 自体は受理済み (URL から確認できる) なので、timeout exceeded を検出したら
          # warning 扱いで exit 0 に書き換えて CI を green 化する。それ以外の exit 1 はそのまま fail。
          set +e
          pnpm exec web-ext sign \
            --source-dir=firefox-build \
            --artifacts-dir=web-ext-artifacts \
            --channel=listed \
            --amo-metadata=.amo-metadata.json 2>&1 | tee /tmp/web-ext.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q "Approval: timeout exceeded" /tmp/web-ext.log; then
              echo "::warning::web-ext sign が timeout exceeded で exit 1 を返したが submission は AMO に受理済み (AGENTS.md「Firefox AMO 対応」既知挙動)。CI green 化のため exit 0 扱いに変換します"
            elif grep -qiE "version (already exists|conflict)" /tmp/web-ext.log; then
              # セルフレビュー #2 修正: AMO pre-flight は `/versions/` (listed のみ) を参照するため、
              # pending / awaiting_review な submission を検知できない。release ブランチを force-push
              # 後に再度 push したケースで「pre-flight pass → web-ext sign 失敗」になりうるため、
              # version 重複エラーを timeout exceeded と同じく warning に降格する (pre-flight の
              # 取りこぼし救済)。
              echo "::warning::AMO に既に同 version が存在するため web-ext sign が version conflict で fail (pre-flight が pending submission を検知できないケース)。CI green 化のため exit 0 扱いに変換します"
            else
              echo "::error::web-ext sign が timeout exceeded / version conflict 以外の理由で失敗しました (rc=$rc)。ログ確認要"
              exit "$rc"
            fi
          fi
          echo "🦊 Firefox AMO への submission 送信完了 (レビュー待ち)"
          echo "🔗 AMO Developer Hub: https://addons.mozilla.org/developers/"
          echo "⏰ レビュー結果は通常 1〜数日でメール通知"
