name: Publish to Chrome Web Store + Firefox AMO

on:
  workflow_dispatch:
    inputs:
      target:
        description: '再開する提出先を一つ選択'
        type: choice
        options:
          - chrome
          - firefox
        required: true
      expected_sha:
        description: '事前照合済みの release head または修復コミットの完全 SHA'
        type: string
        required: true
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  package:
    name: ZIP パッケージ作成
    runs-on: ubuntu-latest
    # 修復 push と GitHub rerun は提出を開始しない。再開時の外部状態照合は vava が行う。
    if: ${{ github.run_attempt == 1 && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == true)) }}
    outputs:
      artifact-attempt: ${{ steps.artifact-identity.outputs.attempt }}
      # version を後続 job (publish / publish-firefox) の pre-flight check に渡す。
      # 同 version や不明な状態では停止し、重複提出を防ぐ。
      version: ${{ steps.version.outputs.version }}
      chrome-sha256: ${{ steps.verify-chrome.outputs.sha256 }}
      firefox-sha256: ${{ steps.verify-firefox.outputs.sha256 }}
    steps:
      - name: Record native artifact producer attempt
        id: artifact-identity
        shell: bash
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: 提出対象を確認
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PUBLISH_TARGET: ${{ inputs.target }}
        run: |
          case "$PUBLISH_TARGET" in
            chrome|firefox) ;;
            *) echo "::error::未対応の提出対象です"; exit 1 ;;
          esac

      # サプライチェーン攻撃対策で SHA ピン留め (#6)。タグは指すコミットを書き換え可能なため
      # 信頼境界として弱い。Dependabot (.github/dependabot.yml) が SHA + タグコメント形式の
      # 更新 PR を自動生成するので、そちらをマージして最新化する運用。
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: 再開対象のコミットを確認
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          checked_sha=$(git rev-parse --verify 'HEAD^{commit}')
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$EVENT_SHA" || "$checked_sha" != "$EVENT_SHA" ]]; then
            echo "::error::照合済み SHA、イベント SHA、checkout SHA が一致しません"
            exit 1
          fi
          echo "✅ 再開対象コミット一致: $checked_sha"

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Prepare Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json

      - name: 依存インストール
        # lockfile の整合性を強制するため bun run deps のみ。
        # frozen-lockfile は lockfile を迂回した最新依存取得を禁止し、サプライチェーン攻撃の
        # 経路を塞ぐ。lockfile が古い場合は CI を失敗させ、開発者に更新を促す。
        env:
          # publish workflow ではスクリーンショット生成をしないため、Puppeteer のブラウザ取得は不要。
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies
      - name: Verify support assets
        run: bun --bun run sync:support --check

      - name: テスト実行
        run: bun --bun run test

      - name: アイコン生成
        run: bun scripts/generate-icons.js

      - name: zip パッケージを作成
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'chrome') }}
        run: |
          # _locales/ は manifest.json の default_locale 参照先 (en/ja の messages.json)。
          # 含めないと CWS の Submit for review で `PKG_DEFAULT_LOCALE_MISSING` エラー。
          # 2026-05-13: Draft only 時代はフル validation が走らず通過していたが、auto-publish
          # 化で発覚した bug。zip.ps1 / zip.sh は最初から _locales を含めている。
          bun scripts/copy-package-files.js chrome chrome-build
          (cd chrome-build && zip -r ../web-viewing-assist.zip .)
          ls -lh web-viewing-assist.zip

      - name: Chrome 最終 ZIP の配布 metadata・参照・hash を検証
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'chrome') }}
        id: verify-chrome
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/verify-release-artifact.py chrome web-viewing-assist.zip

      - name: ZIP artifact を保存
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'chrome') }}
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'web-viewing-assist-zip' -Path @('web-viewing-assist.zip') | Out-Null

      - name: Firefox 用ソースディレクトリを構築
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'firefox') }}
        # manifest.firefox.json を manifest.json として配置し、icons / src / _locales を同梱。
        # 音量ブースター関連 permission (offscreen / tabCapture) は manifest.firefox.json で
        # 除外済み。さらに background.js から chrome.offscreen / chrome.tabCapture の呼び出し
        # ブロックを __FIREFOX_STRIP_BEGIN__ / __FIREFOX_STRIP_END__ マーカー間で物理削除する
        # (AMO linter の UNSUPPORTED_API 警告 3 件を消すため、v1.0.33 で導入)。
        # ここでは source dir のまま保存する (二度手間の zip 化を避ける)。
        run: |
          mkdir -p firefox-build
          bun scripts/copy-package-files.js firefox firefox-build
          # Firefox 未対応 API 呼び出しブロックを strip (AMO linter UNSUPPORTED_API 警告対策)
          bun scripts/strip-firefox-background.js firefox-build/src/background/background.js
          echo "🦊 Firefox strip 完了 (chrome.offscreen / chrome.tabCapture 呼び出しを削除)"
          echo "📂 firefox-build 内容:"
          ls -la firefox-build/

      - name: Firefox 提出ソースの配布 metadata・参照・全ファイル hash を検証
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'firefox') }}
        id: verify-firefox
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/verify-release-artifact.py firefox firefox-build

      - name: Firefox source artifact を保存
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'firefox') }}
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'web-viewing-assist-firefox-source' -Path @('firefox-build/') | Out-Null

  publish:
    name: Chrome Web Store にアップロード + Submit for review
    runs-on: ubuntu-latest
    needs: package
    # Firefox の再開時は、審査中・公開済みの Chrome へ再提出しない。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'firefox' }}
    environment: chrome-web-store
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: ZIP artifact を取得
        shell: pwsh
        env:
          ARTIFACT_RUN_ATTEMPT: ${{ needs.package.outputs.artifact-attempt }}
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'web-viewing-assist-zip' -Destination '.' -RunAttempt $env:ARTIFACT_RUN_ATTEMPT

      - name: ダウンロードした送信 ZIP と検証済み ZIP の同一性を確認
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.chrome-sha256 }}
        run: |
          test -n "$EXPECTED_SHA256"
          echo "$EXPECTED_SHA256  web-viewing-assist.zip" | sha256sum --check --strict

      - name: Chrome Web Store に検証済み ZIP を HTTP 提出
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID || secrets.CWS_PUBLISHER_ID }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "web-viewing-assist.zip" -ExpectedSha256 "${{ needs.package.outputs.chrome-sha256 }}" -CheckExistingVersion

  publish-firefox:
    name: Firefox AMO に submission
    runs-on: ubuntu-latest
    needs: package
    # package 成功を必須にし、Chrome の結果からは独立して提出する。
    # Chrome のみ再開するときは Firefox へ再提出しない。
    if: ${{ needs.package.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.target != 'chrome') }}
    # AMO 用 environment が必要なら gh api で別途作成可能だが、当面は repository scope の
    # AMO_JWT_ISSUER / AMO_JWT_SECRET secrets で動かす (Chrome 側と同じ秘匿レベル)。
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: Firefox source artifact を取得
        shell: pwsh
        env:
          ARTIFACT_RUN_ATTEMPT: ${{ needs.package.outputs.artifact-attempt }}
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'web-viewing-assist-firefox-source' -Destination 'firefox-build/' -RunAttempt $env:ARTIFACT_RUN_ATTEMPT

      - name: Prepare Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json

      - name: web-ext 依存インストール
        # bun run deps で integrity 検証し、実行時に web-ext 10.8.0 を確認。
        # publish では screenshot 生成不要なので Puppeteer browser DL は skip。
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies
      - name: Verify support assets
        run: bun --bun run sync:support --check

      - name: ダウンロードした実 source-dir と検証済みソースの同一性を確認
        env:
          EXPECTED_VERSION: ${{ needs.package.outputs.version }}
          EXPECTED_SHA256: ${{ needs.package.outputs.firefox-sha256 }}
        run: |
          test -n "$EXPECTED_SHA256"
          python3 scripts/verify-release-artifact.py firefox firefox-build

      - name: Firefox AMO に HTTP submission
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          EXPECTED_VERSION: ${{ needs.package.outputs.version }}
          EXPECTED_SHA256: ${{ needs.package.outputs.firefox-sha256 }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishAmo.ps1 -WorkDirectory "$RUNNER_TEMP/amo-publisher-tests"
          test ! -e firefox-build/.amo-upload-uuid
          mkdir -p web-ext-artifacts
          ARCHIVE="$GITHUB_WORKSPACE/web-ext-artifacts/unsigned-submission.xpi"
          test ! -e "$ARCHIVE"
          pwsh -NoProfile -File scripts/Test-FirefoxArchive.ps1 -WorkDirectory "$RUNNER_TEMP/firefox-archive-tests"
          pwsh -NoProfile -File scripts/New-FirefoxArchive.ps1 -SourceDirectory firefox-build -Archive "$ARCHIVE" > web-ext-artifacts/build-receipt.json
          VERSION=$(python3 -c 'import json; print(json.load(open("firefox-build/manifest.json"))["version"])')
          ADDON_ID=$(python3 -c 'import json; print(json.load(open("firefox-build/manifest.json"))["browser_specific_settings"]["gecko"]["id"])')
          EXPECTED_AMO_METADATA_SHA256="$(sha256sum .amo-metadata.json | cut -d " " -f1)" python3 scripts/verify-release-artifact.py firefox "$ARCHIVE" > web-ext-artifacts/verified.txt
          SHA256=$(sed -n 's/^zip_sha256=//p' web-ext-artifacts/verified.txt)
          pwsh -NoProfile -File scripts/Publish-Amo.ps1 -Archive "$ARCHIVE" -Metadata .amo-metadata.json -AddonId "$ADDON_ID" -ExpectedVersion "$VERSION" -ExpectedSha256 "$SHA256"
