<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Promo Marquee - 1400x560</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1400px; height: 560px;
      background: linear-gradient(135deg, #C0605A 0%, #A8524D 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", sans-serif;
      overflow: hidden; color: #fff;
    }
    .container {
      display: flex; align-items: center; gap: 80px;
    }
    .left { max-width: 520px; }
    h1 { font-size: 52px; font-weight: 800; margin-bottom: 16px; line-height: 1.2; }
    p { font-size: 20px; opacity: 0.9; line-height: 1.6; }
    .features {
      display: flex; flex-direction: column; gap: 16px;
    }
    .feat {
      background: rgba(255,255,255,0.15); border-radius: 12px;
      padding: 16px 20px; display: flex; align-items: center; gap: 14px;
      backdrop-filter: blur(10px);
    }
    .feat .icon { font-size: 28px; }
    .feat .text { font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h1>WEB閲覧アシスト</h1>
      <p>閲覧中ページの見やすさ・聞きやすさ・作業継続性をローカルで整える Chrome 拡張機能。</p>
    </div>
    <div class="features">
      <div class="feat"><span class="icon">🔄</span><span class="text">セッション維持</span></div>
      <div class="feat"><span class="icon">🧹</span><span class="text">YouTube クリーナー</span></div>
      <div class="feat"><span class="icon">📦</span><span class="text">Amazon 月別合計</span></div>
      <div class="feat"><span class="icon">📷</span><span class="text">Instagram クリーナー</span></div>
      <div class="feat"><span class="icon">🔊</span><span class="text">タブ音量ブースター</span></div>
    </div>
  </div>
</body>
</html>
