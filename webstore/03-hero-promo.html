<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Screenshot 3 - Hero Promo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #171414;
      --paper: #fff8ea;
      --akane: #c0605a;
      --akane-dark: #7d3936;
      --night: #182232;
      --line: rgba(255, 248, 234, 0.12);
    }
    body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      color: var(--paper);
      font-family: "BIZ UDPGothic", "Yu Gothic", sans-serif;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        radial-gradient(circle at 78% 24%, rgba(192, 96, 90, 0.34), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(217, 164, 65, 0.22), transparent 28%),
        #182232;
      background-size: 38px 38px, 38px 38px, auto, auto, auto;
      display: grid;
      place-items: center;
    }
    .stage {
      width: 1130px;
      height: 670px;
      display: grid;
      grid-template-columns: 500px 1fr;
      gap: 58px;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 248, 234, 0.1);
      border: 1px solid rgba(255, 248, 234, 0.16);
      color: #f4c29c;
      font-weight: 900;
      letter-spacing: 0.13em;
      font-size: 13px;
      margin-bottom: 28px;
    }
    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f4c29c;
      box-shadow: 14px 0 0 var(--akane);
    }
    h1 {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 72px;
      line-height: 1.02;
      letter-spacing: -0.06em;
      margin-bottom: 26px;
    }
    h1 span { color: #f4c29c; }
    .lead {
      color: rgba(255, 248, 234, 0.76);
      font-size: 20px;
      line-height: 1.85;
      margin-bottom: 36px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .stat {
      padding: 16px 14px;
      border-radius: 18px;
      background: rgba(255, 248, 234, 0.1);
      border: 1px solid rgba(255, 248, 234, 0.13);
    }
    .stat strong {
      display: block;
      font-family: "Yu Mincho", serif;
      font-size: 32px;
      color: #f4c29c;
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat span {
      font-size: 12px;
      color: rgba(255, 248, 234, 0.65);
      font-weight: 700;
    }
    .browser {
      position: relative;
      height: 520px;
      border-radius: 30px;
      background: #fff8ea;
      color: var(--ink);
      box-shadow: 0 44px 88px rgba(0, 0, 0, 0.42), inset 0 0 0 1px rgba(255,255,255,0.7);
      overflow: hidden;
      rotate: -1.2deg;
    }
    .bar {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 22px;
      background: #f0decc;
      border-bottom: 1px solid rgba(23, 20, 20, 0.08);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot:nth-child(1) { background: #df6b62; }
    .dot:nth-child(2) { background: #d6a13e; }
    .dot:nth-child(3) { background: #60896c; }
    .url {
      margin-left: 12px;
      flex: 1;
      height: 30px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #7d6c63;
      display: flex;
      align-items: center;
      padding-left: 18px;
      font-size: 13px;
      font-weight: 700;
    }
    .browser-body {
      position: relative;
      height: calc(100% - 58px);
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 190px;
      gap: 22px;
    }
    .video {
      border-radius: 26px;
      background:
        radial-gradient(circle at 68% 42%, rgba(192, 96, 90, 0.34), transparent 24%),
        linear-gradient(135deg, #2a3038, #111820);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 260px;
    }
    .soundbar {
      height: 58px;
      border-radius: 18px;
      background: rgba(255, 248, 234, 0.13);
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      gap: 5px;
      align-items: end;
      padding: 10px 14px;
    }
    .soundbar i {
      display: block;
      border-radius: 99px;
      background: #f4c29c;
      opacity: 0.88;
    }
    .soundbar i:nth-child(3n) { height: 21px; background: #c0605a; }
    .soundbar i:nth-child(3n+1) { height: 34px; }
    .soundbar i:nth-child(3n+2) { height: 44px; }
    .side {
      display: grid;
      gap: 14px;
    }
    .pill {
      border-radius: 20px;
      background: #fff;
      padding: 16px;
      box-shadow: 0 16px 30px rgba(58, 41, 34, 0.1);
      font-weight: 900;
      line-height: 1.45;
    }
    .pill small {
      display: block;
      color: #8c7770;
      font-size: 12px;
      margin-top: 5px;
      font-weight: 700;
    }
    .floating {
      position: absolute;
      left: 300px;
      bottom: 42px;
      width: 250px;
      padding: 18px;
      border-radius: 24px;
      background: #211d1b;
      color: #fff8ea;
      box-shadow: 0 26px 48px rgba(33, 29, 27, 0.36);
      rotate: 2.8deg;
    }
    .floating strong {
      display: block;
      color: #f4c29c;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .floating span {
      color: rgba(255, 248, 234, 0.7);
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section>
      <div class="badge">VIEWING ASSIST</div>
      <h1>動画も、SNSも、<br><span>ちょうどよく。</span></h1>
      <p class="lead">YouTube のノイズ整理、配信の音量差補正、Instagram の集中モード、Amazon の月別合計まで。日常の Web 閲覧をローカル処理で整えます。</p>
      <div class="stats" aria-label="特徴">
        <div class="stat"><strong>6</strong><span>閲覧支援カテゴリ</span></div>
        <div class="stat"><strong>300%</strong><span>タブ音量調整</span></div>
        <div class="stat"><strong>0</strong><span>外部データ送信</span></div>
      </div>
    </section>
    <section class="browser" aria-label="利用イメージ">
      <div class="bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <div class="url">youtube.com/watch</div>
      </div>
      <div class="browser-body">
        <div class="video">
          <div class="soundbar" aria-hidden="true">
            <i style="height:18px"></i><i style="height:29px"></i><i style="height:44px"></i><i style="height:26px"></i><i style="height:38px"></i><i style="height:52px"></i><i style="height:20px"></i><i style="height:30px"></i><i style="height:42px"></i><i style="height:24px"></i><i style="height:36px"></i><i style="height:48px"></i><i style="height:19px"></i><i style="height:31px"></i><i style="height:39px"></i><i style="height:23px"></i><i style="height:34px"></i><i style="height:45px"></i>
          </div>
        </div>
        <div class="side">
          <div class="pill">Shorts を非表示<small>YouTube クリーナー</small></div>
          <div class="pill">ナイトモード<small>声とゲーム音を聞きやすく</small></div>
          <div class="pill">コメント欄 OFF<small>動画ページをすっきり</small></div>
        </div>
      </div>
      <div class="floating">
        <strong>自動音量正規化 ON</strong>
        <span>小さい場面を持ち上げ、大きすぎるピークは自然に抑えます。</span>
      </div>
    </section>
  </main>
</body>
</html>
