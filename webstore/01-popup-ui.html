<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Screenshot 1 - Popup UI</title>
  <!--
    マーケティング素材 (1280×800)。右側に実際の popup を iframe で埋め込み、
    popup.html / popup.css / popup.js の変更が自動的にスクショに反映される設計。
    `popup-render.html` は generate-screenshots.js が popup.html から動的生成する
    （chrome.* shim 注入 + 相対パス調整）。
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px; height: 800px;
      background: linear-gradient(135deg, #C0605A 0%, #A8524D 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      overflow: hidden;
      gap: 64px;
      padding: 0 48px;
    }
    .text-area {
      color: #fff;
      max-width: 480px;
    }
    .text-area .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    .text-area h1 {
      font-size: 44px; font-weight: 800; margin-bottom: 16px; line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .text-area p {
      font-size: 18px; opacity: 0.92; line-height: 1.7;
    }
    /* 実 popup を iframe で埋め込むフレーム。クリッピングで縦スクロールを隠し、
       実機の popup と同じ 380px 幅で見せる。 */
    .popup-frame {
      width: 380px;
      height: 720px;
      overflow: hidden;
      border-radius: 14px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.2);
    }
    .popup-frame iframe {
      width: 380px;
      height: 1100px; /* popup の全長を確保（accordion 閉じた状態でも余裕）*/
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="text-area">
    <span class="badge">Chrome 拡張機能</span>
    <h1>WEB閲覧アシスト</h1>
    <p>セッション維持・YouTube クリーナー・Amazon 月別合計・Instagram クリーナー・音量ブースターを 1 つのパネルから切り替え。すべてオプトイン、データ収集ゼロ。</p>
  </div>
  <div class="popup-frame">
    <iframe src="popup-render.html" title="WEB閲覧アシスト ポップアップ"></iframe>
  </div>
</body>
</html>
