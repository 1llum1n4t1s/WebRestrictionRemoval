<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Screenshot 2 - Features</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px; height: 800px;
      background: linear-gradient(135deg, #fdf2f2 0%, #f5c6c6 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .container { text-align: center; }
    h1 {
      font-size: 40px; font-weight: 800; color: #A8524D;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 18px; color: #777; margin-bottom: 48px;
    }
    .features {
      display: flex; gap: 22px; justify-content: center;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 22px;
      width: 210px; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    .card .icon { font-size: 44px; margin-bottom: 14px; }
    .card .name { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 8px; }
    .card .desc { font-size: 12px; color: #888; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>5カテゴリの閲覧支援</h1>
    <p class="subtitle">必要な補助だけをオプトインで切り替え</p>
    <div class="features">
      <div class="card">
        <div class="icon">🔄</div>
        <div class="name">セッション維持</div>
        <div class="desc">アイドル検知を軽くリセット</div>
      </div>
      <div class="card">
        <div class="icon">🧹</div>
        <div class="name">YouTube クリーナー</div>
        <div class="desc">Shorts 削除・検索結果整理・コメント欄非表示など 21 機能</div>
      </div>
      <div class="card">
        <div class="icon">📦</div>
        <div class="name">Amazon 合計</div>
        <div class="desc">定期おトク便の月別合計を表示</div>
      </div>
      <div class="card">
        <div class="icon">📷</div>
        <div class="name">Instagram クリーナー</div>
        <div class="desc">Reels・Explore など 10 機能を非表示</div>
      </div>
      <div class="card">
        <div class="icon">🔊</div>
        <div class="name">音量ブースター</div>
        <div class="desc">0〜600% 増幅 + 自動歪み防止 / 音量正規化</div>
      </div>
    </div>
  </div>
</body>
</html>
