<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Promo Small - 440x280</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      color: #fff8ea;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      background:
        radial-gradient(circle at 84% 18%, rgba(244, 194, 156, 0.32), transparent 30%),
        radial-gradient(circle at 15% 92%, rgba(255, 248, 234, 0.18), transparent 34%),
        linear-gradient(135deg, #1d252f 0%, #8f433f 62%, #c0605a 100%);
      display: grid;
      place-items: center;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 248, 234, 0.28);
      border-radius: 28px;
    }
    .wrap {
      position: relative;
      width: 358px;
    }
    .mark {
      position: absolute;
      right: -10px;
      top: -42px;
      font: 900 80px/1 "BIZ UDPGothic", "Yu Gothic", sans-serif;
      color: rgba(255, 248, 234, 0.13);
      letter-spacing: -0.12em;
    }
    .tag {
      display: inline-block;
      margin-bottom: 12px;
      color: #f4c29c;
      font: 900 12px/1 "BIZ UDPGothic", "Yu Gothic", sans-serif;
      letter-spacing: 0.16em;
    }
    h1 {
      font-size: 38px;
      line-height: 1.04;
      letter-spacing: -0.06em;
      margin-bottom: 14px;
    }
    p {
      font: 700 14px/1.65 "BIZ UDPGothic", "Yu Gothic", sans-serif;
      color: rgba(255, 248, 234, 0.8);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark">6</div>
    <div class="tag">LOCAL WEB TOOLKIT</div>
    <h1>WEB閲覧<br>アシスト</h1>
    <p>セッション維持 / YouTube 整理 / Amazon 合計 / Instagram / 音量 / カラー</p>
  </main>
</body>
</html>
