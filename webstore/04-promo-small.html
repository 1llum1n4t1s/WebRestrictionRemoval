<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Vuora — Promo Small 440x280</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg0: #0b0e13;
      --ink: #f5efe4;
      --mut: rgba(245, 239, 228, 0.62);
      --amber: #f3ba8a;
      --rose: #c64b54;
      --teal: #6fc2cf;
      --line: rgba(245, 239, 228, 0.12);
      --serif: "Fraunces", "Zen Old Mincho", Georgia, serif;
      --mincho: "Zen Old Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
      --gothic: "Zen Kaku Gothic New", "BIZ UDPGothic", "Yu Gothic", sans-serif;
    }
    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--gothic);
      position: relative;
      background:
        radial-gradient(ellipse 70% 64% at 86% 14%, rgba(243, 186, 138, 0.26), transparent 62%),
        radial-gradient(ellipse 80% 70% at 6% 96%, rgba(198, 75, 84, 0.26), transparent 60%),
        radial-gradient(circle at 96% 100%, rgba(111, 194, 207, 0.16), transparent 46%),
        var(--bg0);
      display: grid;
      place-items: center;
    }
    body::after {
      content: "";
      position: absolute; inset: 14px;
      border-radius: 22px;
      box-shadow: inset 0 0 0 1px var(--line);
      pointer-events: none;
    }
    /* aura ring 装飾（右上） */
    .ring {
      position: absolute;
      top: -78px; right: -78px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, var(--amber), var(--rose), var(--teal), var(--amber));
      filter: blur(2px);
      opacity: 0.5;
      mask-image: radial-gradient(circle, transparent 56%, #000 58%, #000 66%, transparent 68%);
      -webkit-mask-image: radial-gradient(circle, transparent 56%, #000 58%, #000 66%, transparent 68%);
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 372px;
    }
    .eyebrow {
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      color: var(--amber);
      margin-bottom: 8px;
    }
    .wordmark {
      font-family: var(--serif);
      font-weight: 900;
      font-size: 86px;
      line-height: 0.86;
      letter-spacing: -0.035em;
      background: linear-gradient(166deg, #fbf4e8 10%, #f3ba8a 56%, #d98a64 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 12px;
    }
    .tagline {
      font-family: var(--mincho);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
    }
    .tagline em { font-style: normal; color: var(--amber); }
    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--mut);
    }
    .meta b {
      font-family: var(--serif);
      font-weight: 900;
      color: var(--teal);
    }
    .meta .sep { width: 4px; height: 4px; border-radius: 50%; background: var(--mut); }
  </style>
</head>
<body>
  <div class="ring" aria-hidden="true"></div>
  <main class="wrap">
    <div class="eyebrow">view + aura</div>
    <div class="wordmark">Vuora</div>
    <div class="tagline">見るページを、<em>澄ませる</em>。</div>
    <div class="meta"><span><b>13</b> 機能</span><span class="sep"></span><span>外部送信ゼロ</span><span class="sep"></span><span>すべて手元で ON/OFF</span></div>
  </main>
</body>
</html>
